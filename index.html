<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prode Familiar</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Instrument Sans', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; max-width: 600px; text-align: center; margin-bottom: 20px; }
        
        .caja-login { background-color: #1e293b; border: 1px solid #3b82f6; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; box-sizing: border-box; text-align: left; margin: 0 auto; }
        .caja-login label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 0.95rem; font-weight: 600; }
        .caja-login select, .caja-login input { width: 100%; padding: 12px; background-color: #0f172a; color: white; border: 1px solid #475569; border-radius: 8px; font-size: 1.1rem; font-family: 'Instrument Sans', sans-serif; box-sizing: border-box; margin-bottom: 20px; text-align: center; }
        .btn-ingresar { background-color: #3b82f6; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn-ingresar:hover { background-color: #2563eb; }

        .main-tabs { display: flex; width: 100%; max-width: 600px; gap: 10px; margin-bottom: 25px; }
        .btn-tab { flex: 1; background-color: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 15px; border-radius: 12px; font-family: 'Instrument Sans', sans-serif; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .btn-tab.activo { background-color: #3b82f6; color: white; border-color: #3b82f6; }

        #panel-app { display: none; width: 100%; max-width: 600px; flex-direction: column; align-items: center; }
        #seccion-prode, #seccion-ranking { width: 100%; }

        .fases-nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; margin-bottom: 20px; }
        .btn-fase { background-color: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 8px 16px; border-radius: 20px; font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
        .btn-fase.activo { background-color: #3b82f6; color: white; border-color: #3b82f6; }

        .partido-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 15px 20px; margin-bottom: 15px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; }
        .info-partido { display: flex; justify-content: space-between; align-items: center; color: #94a3b8; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        
        /* NUEVO: Estilos para Banderas y Nombres Completos */
        .fila-partido { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 10px; }
        .equipo-container { display: flex; align-items: center; gap: 10px; flex: 1; }
        .equipo-container.local { justify-content: flex-end; text-align: right; }
        .equipo-container.visitante { justify-content: flex-start; text-align: left; }
        
        .nombres { display: flex; flex-direction: column; }
        .abrev { font-weight: 700; font-size: 1.25rem; color: #f8fafc; }
        .nombre-completo { font-size: 0.75rem; color: #94a3b8; font-weight: 600; margin-top: 2px; }
        .bandera { width: 32px; height: auto; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.4); }

        .centro-inputs { display: flex; align-items: center; gap: 10px; justify-content: center; }
        input[type="number"] { width: 45px; height: 45px; background-color: #0f172a; border: 1px solid #475569; color: white; font-size: 1.2rem; text-align: center; border-radius: 8px; font-weight: bold; }
        input[type="number"]:disabled { background-color: #1e293b; border-color: #334155; color: #475569; cursor: not-allowed; }
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
        input[type="number"].completado { border-color: #10b981; color: #10b981; }
        .vs { color: #64748b; font-size: 0.9rem; font-weight: bold; }
        
        .btn-guardar { background-color: #10b981; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 1.1rem; font-weight: 600; cursor: pointer; margin-top: 10px; margin-bottom: 40px; width: 100%; }
        
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; background-color: #1e293b; border-radius: 12px; border: 1px solid #334155; }
        .tabla-ranking { width: 100%; border-collapse: collapse; white-space: nowrap; }
        .tabla-ranking th, .tabla-ranking td { padding: 12px 15px; text-align: center; border-bottom: 1px solid #334155; }
        .tabla-ranking th { background-color: #0f172a; color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.5px; }
        .tabla-ranking tr:last-child td { border-bottom: none; }
        .puntos-destacados { color: #3b82f6; font-size: 1.2rem; font-weight: bold; }
        .dato-secundario { color: #94a3b8; font-size: 0.9rem; }
        
        #cargando { color: #3b82f6; font-size: 1.1rem; font-weight: bold; margin-bottom: 20px; }

        .badge-estado { margin-left: 10px; font-size: 0.78rem; font-weight: 700; padding: 3px 8px; border-radius: 20px; vertical-align: middle; }
        .badge-en-curso { background-color: #ef4444; color: white; animation: pulso 1.4s infinite; }
        .badge-pausa { background-color: #f59e0b; color: white; }
        .badge-finalizado { background-color: #334155; color: #94a3b8; }
        @keyframes pulso { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
        .partido-card.pausa { border-color: #f59e0b; }

        .resultado-real { display: none; margin-top: 14px; text-align: center; }
        .marcador-real { display: inline-flex; align-items: center; gap: 12px; background-color: #0f172a; border: 1px solid #475569; border-radius: 10px; padding: 8px 20px; font-size: 1.4rem; font-weight: 700; color: #f8fafc; letter-spacing: 2px; }
        .marcador-real span { color: #64748b; font-size: 1rem; font-weight: 600; }
        .resultado-label { color: #64748b; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }

        .partido-card.en-curso { border-color: #ef4444; }
        .partido-card.finalizado { border-color: #475569; opacity: 0.85; }

        .marcador-real.exacto { border-color: #10b981; box-shadow: 0 0 0 1px #10b981; }
        .marcador-real.parcial { border-color: #f59e0b; box-shadow: 0 0 0 1px #f59e0b; }
        .marcador-real.erroneo { border-color: #ef4444; box-shadow: 0 0 0 1px #ef4444; }

        .clasificado-selector { margin-top: 12px; text-align: center; }
        .clasificado-label { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .clasificado-btns { display: flex; gap: 10px; justify-content: center; }
        .btn-clasificado { background-color: #0f172a; color: #94a3b8; border: 1px solid #475569; padding: 8px 20px; border-radius: 8px; font-family: 'Instrument Sans', sans-serif; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: 0.2s; }
        .btn-clasificado.seleccionado { background-color: #3b82f6; color: white; border-color: #3b82f6; }
        .btn-clasificado:disabled { cursor: not-allowed; opacity: 0.5; }
        .clasificado-real { margin-top: 8px; font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .clasificado-real span { color: #f8fafc; font-weight: 700; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🏆 Prode Familiar 2026</h2>
        <div id="cargando">Conectando con la base de datos... ⚽</div>
    </div>

    <div id="panel-login" class="caja-login" style="display: none;">
        <label for="jugador">¿Quién sos?</label>
        <select id="jugador">
            <option value="">Seleccioná tu nombre...</option>
        </select>
        
        <label for="pin">PIN de seguridad (4 dígitos)</label>
        <input type="password" id="pin" placeholder="****" pattern="[0-9]*" inputmode="numeric" maxlength="4">
        
        <button class="btn-ingresar" id="btn-ingreso" onclick="intentarIngreso()">Ingresar</button>
    </div>

    <div id="panel-app">
        
        <div class="main-tabs">
            <button id="tab-prode" class="btn-tab activo" onclick="cambiarSeccion('prode')">⚽ Mis Pronósticos</button>
            <button id="tab-ranking" class="btn-tab" onclick="cambiarSeccion('ranking')">📊 Ranking</button>
        </div>

        <div style="width: 100%; text-align: left; margin-bottom: 15px; color: #94a3b8; font-size: 0.9rem;">
            Sesión iniciada como: <strong id="nombre-activo" style="color: white;"></strong>
        </div>

        <div id="seccion-prode">
            <div id="navegacion-fases" class="fases-nav"></div>
            <div id="contenedor-partidos" style="width: 100%;"></div>
            <button class="btn-guardar" id="btn-guardar" onclick="enviarPronosticos()">Guardar resultados</button>
        </div>

        <div id="seccion-ranking" style="display: none;">
            <div class="table-responsive">
                <table class="tabla-ranking">
                    <thead>
                        <tr>
                            <th>Pos.</th>
                            <th style="text-align: left;">Jugador</th>
                            <th>Pts</th>
                            <th>Cargas</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-ranking">
                        </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // === ATENCIÓN: PEGÁ TU ÚLTIMA URL DE APPS SCRIPT ACÁ ===
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzxPrpcez6puFaNWFRg06gyZbGR9PM_ufZLD6l_K-xMnLfyhwxt2lHmhNSsyWCxVj3OFg/exec';
        
        let usuarioActual = "";
        let pinActual = "";

        // DICCIONARIO DE PAÍSES Y BANDERAS (Códigos ISO)
        const paisesDatos = {
            "MEX": { nombre: "México", flag: "mx" }, "RSA": { nombre: "Sudáfrica", flag: "za" },
            "KOR": { nombre: "Corea del Sur", flag: "kr" }, "CZE": { nombre: "Rep. Checa", flag: "cz" },
            "CAN": { nombre: "Canadá", flag: "ca" }, "BIH": { nombre: "Bosnia", flag: "ba" },
            "QAT": { nombre: "Qatar", flag: "qa" }, "SUI": { nombre: "Suiza", flag: "ch" },
            "BRA": { nombre: "Brasil", flag: "br" }, "MAR": { nombre: "Marruecos", flag: "ma" },
            "HAI": { nombre: "Haití", flag: "ht" }, "SCO": { nombre: "Escocia", flag: "gb-sct" },
            "USA": { nombre: "Estados Unidos", flag: "us" }, "PAR": { nombre: "Paraguay", flag: "py" },
            "AUS": { nombre: "Australia", flag: "au" }, "TUR": { nombre: "Turquía", flag: "tr" },
            "GER": { nombre: "Alemania", flag: "de" }, "CUW": { nombre: "Curazao", flag: "cw" },
            "CIV": { nombre: "C. de Marfil", flag: "ci" }, "ECU": { nombre: "Ecuador", flag: "ec" },
            "NED": { nombre: "Países Bajos", flag: "nl" }, "JPN": { nombre: "Japón", flag: "jp" },
            "SWE": { nombre: "Suecia", flag: "se" }, "TUN": { nombre: "Túnez", flag: "tn" },
            "BEL": { nombre: "Bélgica", flag: "be" }, "EGY": { nombre: "Egipto", flag: "eg" },
            "IRN": { nombre: "Irán", flag: "ir" }, "NZL": { nombre: "N. Zelanda", flag: "nz" },
            "ESP": { nombre: "España", flag: "es" }, "CPV": { nombre: "Cabo Verde", flag: "cv" },
            "KSA": { nombre: "Arabia Saudita", flag: "sa" }, "URU": { nombre: "Uruguay", flag: "uy" },
            "FRA": { nombre: "Francia", flag: "fr" }, "SEN": { nombre: "Senegal", flag: "sn" },
            "IRQ": { nombre: "Irak", flag: "iq" }, "NOR": { nombre: "Noruega", flag: "no" },
            "ARG": { nombre: "Argentina", flag: "ar" }, "ALG": { nombre: "Argelia", flag: "dz" },
            "AUT": { nombre: "Austria", flag: "at" }, "JOR": { nombre: "Jordania", flag: "jo" },
            "POR": { nombre: "Portugal", flag: "pt" }, "COD": { nombre: "RD Congo", flag: "cd" },
            "COL": { nombre: "Colombia", flag: "co" }, "UZB": { nombre: "Uzbekistán", flag: "uz" },
            "ENG": { nombre: "Inglaterra", flag: "gb-eng" }, "CRO": { nombre: "Croacia", flag: "hr" },
            "GHA": { nombre: "Ghana", flag: "gh" }, "PAN": { nombre: "Panamá", flag: "pa" }
        };

        window.onload = function() {
            fetch(scriptURL)
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        document.getElementById('cargando').innerHTML = "⚠️ <b>Error en la base de datos:</b> " + data.error;
                        return;
                    }
                    
                    document.getElementById('cargando').style.display = 'none';
                    document.getElementById('panel-login').style.display = 'block';
                    
                    const select = document.getElementById('jugador');
                    if (data.jugadores) {
                        data.jugadores.forEach(nombre => {
                            let opcion = document.createElement('option');
                            opcion.value = nombre; opcion.text = nombre;
                            select.appendChild(opcion);
                        });
                    }

                    const cuerpoRanking = document.getElementById('cuerpo-ranking');
                    if (data.ranking) {
                        data.ranking.forEach((r, index) => {
                            let medalla = (index === 0) ? '🥇 1º' : (index === 1) ? '🥈 2º' : `${index + 1}º`;
                            cuerpoRanking.innerHTML += `
                                <tr>
                                    <td style="font-weight: bold;">${medalla}</td>
                                    <td style="text-align: left; font-weight: bold; color: white;">${r.jugador}</td>
                                    <td class="puntos-destacados">${r.puntos}</td>
                                    <td class="dato-secundario">${r.pronosticosTotales}</td>
                                </tr>
                            `;
                        });
                    }

                    const navFases = document.getElementById('navegacion-fases');
                    if (data.partidos) {
                        navFases.innerHTML = `
                            <button class="btn-fase activo" onclick="filtrarFase('Hoy', this)">📅 Hoy</button>
                            <button class="btn-fase" onclick="filtrarFase('Dieciseisavos', this)">Dieciseisavos</button>
                            <button class="btn-fase" onclick="filtrarFase('Octavos', this)">Octavos</button>
                            <button class="btn-fase" onclick="filtrarFase('Cuartos', this)">Cuartos</button>
                            <button class="btn-fase" onclick="filtrarFase('Semifinal', this)">Semifinal</button>
                            <button class="btn-fase" onclick="filtrarFase('Final', this)">Final / 3° Puesto</button>
                        `;

                        const contenedor = document.getElementById('contenedor-partidos');
                        data.partidos.forEach(p => {
                            let fechaObj = new Date(p.fecha);
                            let minutos = fechaObj.getMinutes() === 0 ? '00' : (fechaObj.getMinutes() < 10 ? '0'+fechaObj.getMinutes() : fechaObj.getMinutes());
                            let fechaLegible = `${fechaObj.getDate()}/${fechaObj.getMonth()+1}/${fechaObj.getFullYear()} - ${fechaObj.getHours()}:${minutos} hs`;

                            // Obtenemos los datos visuales del diccionario
                            let dLocal = paisesDatos[p.local] || { nombre: p.local, flag: "un" };
                            let dVisita = paisesDatos[p.visitante] || { nombre: p.visitante, flag: "un" };

                            // Dibujamos la tarjeta con la nueva estructura
                            let resLocal = (p.resultadoLocal !== undefined && p.resultadoLocal !== null && p.resultadoLocal !== '') ? p.resultadoLocal : '';
                            let resVisita = (p.resultadoVisita !== undefined && p.resultadoVisita !== null && p.resultadoVisita !== '') ? p.resultadoVisita : '';
                            let esEliminatoria = !p.fase.startsWith('Grupo');
                            let clasificadoRealVal = p.clasificadoReal || '';

                            let clasificadoSelectorHtml = esEliminatoria ? `
                                <div class="clasificado-selector" id="clasificado-sel-${p.id}">
                                    <div class="clasificado-label" id="clasificado-label-${p.id}" style="color:#475569;">Ingresá empate para elegir quién clasifica</div>
                                    <div class="clasificado-btns">
                                        <button class="btn-clasificado" id="clas-${p.id}-local" data-equipo="${p.local}" onclick="selClasificado('${p.id}', '${p.local}')" disabled>${p.local}</button>
                                        <button class="btn-clasificado" id="clas-${p.id}-visita" data-equipo="${p.visitante}" onclick="selClasificado('${p.id}', '${p.visitante}')" disabled>${p.visitante}</button>
                                    </div>
                                </div>` : '';

                            contenedor.innerHTML += `
                                <div class="partido-card" data-id="${p.id}" data-fase="${p.fase}" data-fecha="${p.fecha}" data-resultado-local="${resLocal}" data-resultado-visita="${resVisita}" data-estado="${p.estado || ''}" data-minuto="${p.minuto || ''}" data-local="${p.local}" data-visitante="${p.visitante}" data-clasificado-real="${clasificadoRealVal}" data-es-eliminatoria="${esEliminatoria}">
                                    <div class="info-partido">
                                        ${p.fase} | ${fechaLegible}
                                        <span class="badge-estado" id="badge-${p.id}"></span>
                                    </div>
                                    <div class="fila-partido">

                                        <div class="equipo-container local">
                                            <div class="nombres">
                                                <span class="abrev">${p.local}</span>
                                                <span class="nombre-completo">${dLocal.nombre}</span>
                                            </div>
                                            <img src="https://flagcdn.com/w40/${dLocal.flag}.png" class="bandera" alt="${p.local}">
                                        </div>

                                        <div class="centro-inputs">
                                            <input type="number" id="${p.id}-local" min="0" placeholder="-">
                                            <span class="vs">VS</span>
                                            <input type="number" id="${p.id}-visita" min="0" placeholder="-">
                                        </div>

                                        <div class="equipo-container visitante">
                                            <img src="https://flagcdn.com/w40/${dVisita.flag}.png" class="bandera" alt="${p.visitante}">
                                            <div class="nombres">
                                                <span class="abrev">${p.visitante}</span>
                                                <span class="nombre-completo">${dVisita.nombre}</span>
                                            </div>
                                        </div>

                                    </div>
                                    ${clasificadoSelectorHtml}
                                    <div class="resultado-real" id="resultado-${p.id}"></div>
                                </div>
                            `;
                        });
                    }

                    // Listeners para botones de clasificado en eliminatorias
                    document.querySelectorAll('.partido-card[data-es-eliminatoria="true"]').forEach(tarjeta => {
                        const id = tarjeta.getAttribute('data-id');
                        const iL = document.getElementById(id + '-local');
                        const iV = document.getElementById(id + '-visita');
                        if (iL) iL.addEventListener('input', () => actualizarBotonesClasificado(id));
                        if (iV) iV.addEventListener('input', () => actualizarBotonesClasificado(id));
                    });

                    actualizarEstadoPartidos();
                    setInterval(actualizarEstadoPartidos, 30000);

                    // Aplicar filtro Hoy por defecto
                    const btnHoy = document.querySelector('.btn-fase');
                    if (btnHoy) filtrarFase('Hoy', btnHoy);
                })
                .catch(error => {
                    document.getElementById('cargando').innerHTML = "❌ <b>Error de conexión.</b>";
                });
        };

        function cambiarSeccion(seccion) {
            document.getElementById('tab-prode').classList.remove('activo');
            document.getElementById('tab-ranking').classList.remove('activo');
            document.getElementById('seccion-prode').style.display = 'none';
            document.getElementById('seccion-ranking').style.display = 'none';
            
            document.getElementById('tab-' + seccion).classList.add('activo');
            document.getElementById('seccion-' + seccion).style.display = 'block';
        }

        function intentarIngreso() {
            const jugador = document.getElementById('jugador').value;
            const pin = document.getElementById('pin').value;
            const btn = document.getElementById('btn-ingreso');

            if (!jugador || pin === "") { alert("Completá tu nombre y PIN."); return; }
            btn.innerText = "Verificando..."; btn.disabled = true;

            const urlLogin = scriptURL + "?accion=login&jugador=" + encodeURIComponent(jugador) + "&pin=" + encodeURIComponent(pin);

            fetch(urlLogin)
                .then(response => response.json())
                .then(data => {
                    if (data.error === "PIN_INCORRECTO") {
                        alert("❌ PIN incorrecto.");
                        btn.innerText = "Ingresar"; btn.disabled = false;
                        document.getElementById('pin').value = '';
                    } else if (data.exito) {
                        usuarioActual = jugador; 
                        pinActual = pin;
                        
                        document.getElementById('panel-login').style.display = 'none';
                        document.getElementById('panel-app').style.display = 'flex';
                        document.getElementById('nombre-activo').innerText = jugador;

                        for (let id_partido in data.pronosticos) {
                            let inputLocal = document.getElementById(id_partido + '-local');
                            let inputVisita = document.getElementById(id_partido + '-visita');
                            if (inputLocal && inputVisita) {
                                inputLocal.value = data.pronosticos[id_partido].local;
                                inputVisita.value = data.pronosticos[id_partido].visita;
                                inputLocal.classList.add('completado');
                                inputVisita.classList.add('completado');
                            }
                            actualizarBotonesClasificado(id_partido);
                            const clasificadoGuardado = data.pronosticos[id_partido].clasificado;
                            if (clasificadoGuardado) selClasificado(id_partido, clasificadoGuardado);
                        }
                        actualizarEstadoPartidos();
                    }
                })
                .catch(error => { 
                    alert("Error de conexión al validar el PIN."); 
                    btn.innerText = "Ingresar"; btn.disabled = false; 
                });
        }

        function filtrarFase(fase, botonPulsado) {
            document.querySelectorAll('.btn-fase').forEach(btn => btn.classList.remove('activo'));
            botonPulsado.classList.add('activo');
            const hoy = new Date().toLocaleDateString('es-AR', { year: 'numeric', month: '2-digit', day: '2-digit' });
            document.querySelectorAll('.partido-card').forEach(tarjeta => {
                const f = tarjeta.getAttribute('data-fase');
                let mostrar = false;
                if (fase === 'Hoy') {
                    let fechaPartidoStr = new Date(tarjeta.getAttribute('data-fecha')).toLocaleDateString('es-AR', { year: 'numeric', month: '2-digit', day: '2-digit' });
                    mostrar = (fechaPartidoStr === hoy);
                } else if (fase === 'Grupos') {
                    mostrar = f.startsWith('Grupo');
                } else if (fase === 'Final') {
                    mostrar = f === 'Final' || f === 'Tercer Puesto';
                } else {
                    mostrar = f === fase;
                }
                tarjeta.style.display = mostrar ? 'flex' : 'none';
            });
        }

        function actualizarBotonesClasificado(id) {
            const iL = document.getElementById(id + '-local');
            const iV = document.getElementById(id + '-visita');
            const bL = document.getElementById('clas-' + id + '-local');
            const bV = document.getElementById('clas-' + id + '-visita');
            const label = document.getElementById('clasificado-label-' + id);
            if (!bL || !bV) return;
            if (iL.disabled) return; // partido ya empezó, manejado por actualizarEstadoPartidos
            const esEmpate = iL.value !== '' && iV.value !== '' && iL.value === iV.value;
            bL.disabled = !esEmpate;
            bV.disabled = !esEmpate;
            if (label) {
                label.textContent = esEmpate ? '¿Quién clasifica?' : 'Ingresá empate para elegir quién clasifica';
                label.style.color = esEmpate ? '#94a3b8' : '#475569';
            }
            if (!esEmpate) {
                bL.classList.remove('seleccionado');
                bV.classList.remove('seleccionado');
            }
        }

        function selClasificado(id, equipo) {
            const btnLocal = document.getElementById('clas-' + id + '-local');
            const btnVisita = document.getElementById('clas-' + id + '-visita');
            if (btnLocal) btnLocal.classList.remove('seleccionado');
            if (btnVisita) btnVisita.classList.remove('seleccionado');
            const btnSel = btnLocal && btnLocal.getAttribute('data-equipo') === equipo ? btnLocal : btnVisita;
            if (btnSel) btnSel.classList.add('seleccionado');
        }

        function calcularPuntosPartido(predL, predV, predClasif, resL, resV, resClasif, equipoLocal, equipoVisita, esElim) {
            if (esElim) {
                const exacto = predL === resL && predV === resV;
                const predEmpate = predL === predV;
                const realEmpate = resL === resV;
                const empateOk = predEmpate && realEmpate;
                const tendenciaOk = !predEmpate && !realEmpate && Math.sign(predL - predV) === Math.sign(resL - resV);
                const predClasifEfectivo = predEmpate ? predClasif : (predL > predV ? equipoLocal : equipoVisita);
                const realClasifEfectivo = realEmpate ? resClasif : (resL > resV ? equipoLocal : equipoVisita);
                const clasificadoOk = !!(predClasifEfectivo && realClasifEfectivo && predClasifEfectivo === realClasifEfectivo);
                if (exacto && clasificadoOk) return 10;
                if (exacto && !clasificadoOk) return 5;
                if (empateOk && clasificadoOk) return 4;
                if (empateOk && !clasificadoOk) return 1;
                if (tendenciaOk && clasificadoOk) return 4;
                if (clasificadoOk) return 2;
                return 0;
            } else {
                if (predL === resL && predV === resV) return 3;
                if (Math.sign(predL - predV) === Math.sign(resL - resV)) return 1;
                return 0;
            }
        }

        function actualizarEstadoPartidos() {
            const ahora = new Date();
            document.querySelectorAll('.partido-card').forEach(tarjeta => {
                const id = tarjeta.getAttribute('data-id');
                const fechaPartido = new Date(tarjeta.getAttribute('data-fecha'));
                const diffMin = (ahora - fechaPartido) / 60000;
                const badge = document.getElementById('badge-' + id);
                const resultadoDiv = document.getElementById('resultado-' + id);
                const resLocal = tarjeta.getAttribute('data-resultado-local');
                const resVisita = tarjeta.getAttribute('data-resultado-visita');
                const tieneResultado = resLocal !== '' && resVisita !== '';
                const estadoAPI = tarjeta.getAttribute('data-estado');
                const minutoAPI = tarjeta.getAttribute('data-minuto');

                if (diffMin >= 0) {
                    const iL = document.getElementById(id + '-local');
                    const iV = document.getElementById(id + '-visita');
                    if (iL) iL.disabled = true;
                    if (iV) iV.disabled = true;
                    const bL = document.getElementById('clas-' + id + '-local');
                    const bV = document.getElementById('clas-' + id + '-visita');
                    if (bL) bL.disabled = true;
                    if (bV) bV.disabled = true;
                }

                // Estado por tiempo, marcador por API
                let estado;
                if (diffMin >= 115) estado = 'FINALIZADO';
                else if (diffMin >= 0) estado = 'EN_CURSO';
                else estado = 'PENDIENTE';

                if (estado === 'EN_CURSO' || estado === 'PAUSA') {
                    tarjeta.classList.add('en-curso');
                    tarjeta.classList.remove('finalizado', 'pausa');
                    if (estado === 'PAUSA') tarjeta.classList.add('pausa');

                    let minDisplay;
                    if (diffMin < 47) minDisplay = `${Math.min(Math.floor(diffMin), 45)}'`;
                    else if (diffMin < 62) minDisplay = 'ET';
                    else minDisplay = `${Math.min(Math.floor(diffMin - 62) + 45, 90)}'`;
                    badge.innerHTML = `<span class="badge-estado badge-en-curso">🔴 EN CURSO</span> <span style="color:#ef4444;font-weight:700;">${minDisplay}</span>`;

                    if (tieneResultado) {
                        const labelVivo = estado === 'PAUSA' ? 'Al descanso' : 'Resultado parcial';
                        resultadoDiv.innerHTML = `<div class="resultado-label">${labelVivo}</div><div class="marcador-real">${resLocal} <span>-</span> ${resVisita}</div>`;
                        resultadoDiv.style.display = 'block';
                    }
                } else if (estado === 'FINALIZADO') {
                    tarjeta.classList.add('finalizado');
                    tarjeta.classList.remove('en-curso', 'pausa');

                    const inputLocalF = document.getElementById(id + '-local');
                    const inputVisitaF = document.getElementById(id + '-visita');
                    let badgePuntos = '';
                    if (tieneResultado && inputLocalF && inputVisitaF && inputLocalF.value !== '' && inputVisitaF.value !== '') {
                        const esElimF = tarjeta.getAttribute('data-es-eliminatoria') === 'true';
                        const btnSelF = esElimF ? document.querySelector(`#clasificado-sel-${id} .btn-clasificado.seleccionado`) : null;
                        const predClasifF = btnSelF ? btnSelF.getAttribute('data-equipo') : '';
                        const clasifRealF = tarjeta.getAttribute('data-clasificado-real') || '';
                        const equipoLocalF = tarjeta.getAttribute('data-local');
                        const equipoVisitaF = tarjeta.getAttribute('data-visitante');
                        const pts = calcularPuntosPartido(
                            parseInt(inputLocalF.value), parseInt(inputVisitaF.value), predClasifF,
                            parseInt(resLocal), parseInt(resVisita), clasifRealF,
                            equipoLocalF, equipoVisitaF, esElimF
                        );
                        if (pts > 0) badgePuntos = ` <span style="color:#22c55e;font-weight:700;font-size:0.9rem;">+${pts}</span>`;
                    }
                    badge.innerHTML = `<span class="badge-estado badge-finalizado">✅ FINALIZADO</span>${badgePuntos}`;
                    if (tieneResultado) {
                        const esElim2 = tarjeta.getAttribute('data-es-eliminatoria') === 'true';
                        const clasificadoReal2 = tarjeta.getAttribute('data-clasificado-real') || '';
                        const clasificadoHtml = (esElim2 && clasificadoReal2)
                            ? `<div class="clasificado-real">Clasifica: <span>${clasificadoReal2}</span></div>` : '';

                        resultadoDiv.innerHTML = `<div class="resultado-label">Resultado final</div><div class="marcador-real">${resLocal} <span>-</span> ${resVisita}</div>${clasificadoHtml}`;
                        resultadoDiv.style.display = 'block';

                        const marcador = resultadoDiv.querySelector('.marcador-real');
                        if (marcador && inputLocalF && inputVisitaF && inputLocalF.value !== '' && inputVisitaF.value !== '') {
                            const btnSel2 = esElim2 ? document.querySelector(`#clasificado-sel-${id} .btn-clasificado.seleccionado`) : null;
                            const predClasif2 = btnSel2 ? btnSel2.getAttribute('data-equipo') : '';
                            const pts2 = calcularPuntosPartido(
                                parseInt(inputLocalF.value), parseInt(inputVisitaF.value), predClasif2,
                                parseInt(resLocal), parseInt(resVisita), clasificadoReal2,
                                tarjeta.getAttribute('data-local'), tarjeta.getAttribute('data-visitante'), esElim2
                            );
                            const clase = pts2 >= 4 ? 'exacto' : pts2 >= 1 ? 'parcial' : 'erroneo';
                            marcador.classList.remove('exacto', 'parcial', 'erroneo');
                            marcador.classList.add(clase);
                        }
                    }
                } else {
                    tarjeta.classList.remove('en-curso', 'finalizado', 'pausa');
                    badge.innerHTML = '';
                    resultadoDiv.style.display = 'none';
                }
            });

            const hayEnCursoConResultado = [...document.querySelectorAll('.partido-card.en-curso')].some(t => {
                return t.getAttribute('data-resultado-local') !== '' && t.getAttribute('data-resultado-visita') !== '';
            });
            document.querySelectorAll('.puntos-destacados').forEach(celda => {
                const texto = celda.textContent.replace(' ⏳', '');
                celda.textContent = hayEnCursoConResultado ? texto + ' ⏳' : texto;
            });
        }

        function enviarPronosticos() {
            const resultados = [];
            const tarjetas = document.querySelectorAll('.partido-card');
            const ahora = new Date();

            for (let tarjeta of tarjetas) {
                let id = tarjeta.getAttribute('data-id');
                let fechaPartido = new Date(tarjeta.getAttribute('data-fecha'));
                let inputLocal = document.getElementById(id + '-local');
                let inputVisita = document.getElementById(id + '-visita');

                if (inputLocal.disabled || inputVisita.disabled) continue;

                let golesLocal = inputLocal.value;
                let golesVisita = inputVisita.value;

                if (golesLocal !== "" && golesVisita !== "") {
                    if (ahora >= fechaPartido) continue;
                    const esElim = tarjeta.getAttribute('data-es-eliminatoria') === 'true';
                    const esEmpate = esElim && golesLocal === golesVisita;
                    const btnSel = esElim ? document.querySelector(`#clasificado-sel-${id} .btn-clasificado.seleccionado`) : null;
                    const clasificado = btnSel ? btnSel.getAttribute('data-equipo') : '';
                    if (esEmpate && !clasificado) { alert(`Falta seleccionar quién clasifica en el partido ${id}.`); return; }
                    resultados.push({ id_partido: id, golesLocal, golesVisitante: golesVisita, clasificado });
                }
            }

            if (resultados.length === 0) { alert("No llenaste nada nuevo."); return; }

            const btn = document.getElementById('btn-guardar');
            btn.innerText = 'Guardando...'; btn.disabled = true;

            const formData = new URLSearchParams();
            formData.append('jugador', usuarioActual); 
            formData.append('pin', pinActual);         
            formData.append('partidos', JSON.stringify(resultados));

            fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData 
            })
            .then(() => {
                alert(`✅ ¡Resultados guardados con éxito!`);
                resultados.forEach(r => {
                    document.getElementById(r.id_partido + '-local').classList.add('completado');
                    document.getElementById(r.id_partido + '-visita').classList.add('completado');
                });
                btn.innerText = 'Guardar resultados'; btn.disabled = false;
            })
            .catch(error => { 
                alert("Error al intentar guardar."); 
                btn.innerText = 'Guardar resultados'; btn.disabled = false; 
            });
        }
    </script>
